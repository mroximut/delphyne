            \ If a predicate or constant\nis already defined in the previous formalizations, make sure\
            \ you are consistent\nwith the existing definition, spelling, arity, and argument order.\n\
            \nThe syntax for FOL is as follows and nothing else:\n- Bounded variables are represented\
            \ by lowercase letters (e.g., x, y, z).\n- Constants are represented by capitalized words\
